<!DOCTYPE html>
<html>
<head>
    <title>Edit Leave</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1a252f;
        }
    </style>
</head>

<body>

<h2>Edit Leave</h2>

<div class="box">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Update Leave</button>
    </form>

</div>

</body>
</html>
