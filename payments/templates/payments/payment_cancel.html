<!DOCTYPE html>
<html>

<head>

<title>Payment Cancelled</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
}

.container{
    width:600px;
    margin:80px auto;
}

.card{
    background:white;
    padding:35px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 25px;
    background:#e74c3c;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>

Payment Cancelled

</h2>

<p>

Your appointment has been saved, but the payment was not completed.

You can pay later from your upcoming appointments.

</p>

<a
href="{% url 'upcoming_appointments' %}"
class="btn">

Back to Appointments

</a>

</div>

</div>

</body>

</html>
