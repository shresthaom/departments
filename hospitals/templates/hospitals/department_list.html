<!DOCTYPE html>
<html>
<head>
    <title>Departments</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f6f9;
            margin:0;
        }

        .container{
            width:90%;
            margin:30px auto;
        }

        h1{
            color:#2c3e50;
            margin-bottom:25px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
            transition:.2s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card a{
            text-decoration:none;
            color:#2c3e50;
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

<h1>Departments</h1>

<div class="grid">

{% for department in departments %}

<div class="card">

    <a href="{% url 'department_detail' department.id %}">
        {{ department.name }}
    </a>

</div>

{% empty %}

<p>No departments available.</p>

{% endfor %}

</div>

</div>

</body>
</html>
