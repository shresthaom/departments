<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:480px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            box-shadow:0 5px 18px rgba(0,0,0,.12);
        }

        h2{
            text-align:center;
            margin-bottom:35px;
            font-size:42px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:18px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:17px;
            outline:none;
        }

        input:focus{
            border-color:#1565c0;
        }

        .password-box{
            position:relative;
        }

        .eye{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:20px;
            color:#666;
            user-select:none;
        }

        .hint{
            font-size:13px;
            color:#171313;
            margin-top:6px;
            margin-bottom:20px;
            line-height:1.5;
        }

        button{
            width:100%;
            margin-top:15px;
            padding:14px;
            background:#1565c0;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0d47a1;
        }

        .message{
            background:#ffe8e8;
            color:#c62828;
            padding:12px;
            border-radius:6px;
            margin-bottom:20px;
        }

        .login{
            margin-top:25px;
            text-align:center;
        }

        .login a{
            text-decoration:none;
            color:#1565c0;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Register</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<label>Full Name</label>

<input
type="text"
name="name"
placeholder="Enter full name"
required>

<label>Phone Number</label>

<input
type="tel"
name="phone"
placeholder="98XXXXXXXX"
required
maxlength="10"
pattern="9[678]\d{8}">

<div class="hint">
Enter a valid Nepali mobile number.
</div>

<label>Email Address</label>

<input
    type="email"
    name="email"
    placeholder="Enter your email"
    required
>

<label>Address</label>

<input
type="text"
name="address"
placeholder="Enter address"
required>

<label>Date of Birth</label>

<input
type="date"
name="dob"
required>

<label>Gender</label>

<select
name="gender"
required
style="
width:100%;
padding:14px;
margin-bottom:20px;
font-size:17px;
border:1px solid #ccc;
border-radius:8px;
">

<option value="">Select Gender</option>
<option value="M">Male</option>
<option value="F">Female</option>
<option value="O">Other</option>

</select>

<label>Password</label>

<div class="password-box">

<input
id="password"
type="password"
name="password"
required>

<span
class="eye"
onclick="togglePassword()">

👁

</span>

</div>

<div class="hint">
Minimum 8 characters with uppercase, lowercase, number and special character.
</div>

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
required>

<button type="submit">

Register

</button>

</form>
<div class="login">

    Already have an account?

    <a href="{% url 'login' %}">
        Login
    </a>

</div>

</div>


<script>

function togglePassword(){

    const password=document.getElementById("password");

    if(password.type==="password"){

        password.type="text";

    }

    else{

        password.type="password";

    }

}

</script>

</body>
</html>
