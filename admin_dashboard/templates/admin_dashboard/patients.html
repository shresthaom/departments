{% extends 'admin/base.html' %}

{% block title %}
Patients
{% endblock %}

{% block page_title %}
Patients
{% endblock %}

{% block content %}

<table>

    <tr>
        <th>Patient</th>
    </tr>

    {% for patient in patients %}
<tr>
    <td>
        <a href="{% url 'patient_detail' patient.id %}">
            {{ patient.username }}
        </a>
    </td>

    <td>{{ patient.email }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
